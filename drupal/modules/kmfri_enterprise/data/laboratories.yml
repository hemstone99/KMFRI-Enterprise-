faq:
  -
    q: 'What laboratory services does KMFRI provide?'
    a: 'KMFRI provides scientific laboratory testing and analytical services in two main areas: Fish and Fisheries Product Testing and Environmental Testing. Our services support research, regulatory compliance, environmental monitoring, food safety, aquaculture, fisheries management, and the Blue Economy.'
  -
    q: 'What types of fish and fisheries products can be tested?'
    a: 'The laboratory analyzes a wide range of aquatic samples, including fresh fish, frozen fish, processed fish products, shellfish and crustaceans, aquaculture products, fish feeds, and fish tissues and organs.'
  -
    q: 'What environmental samples does KMFRI test?'
    a: 'Environmental samples include marine water, freshwater, wastewater, sediments, soil, effluents, sludge, biological samples, and other environmental matrices within the approved scope.'
  -
    q: 'Is the KMFRI laboratory recognized by NEMA?'
    a: 'Yes. The KMFRI Mombasa Laboratory has been gazetted by the National Environment Management Authority (NEMA) as an approved environmental laboratory authorized to undertake environmental testing within its approved scope.'
  -
    q: 'What environmental analyses are available?'
    a: 'Depending on the sample type and approved scope, analyses include physico-chemical parameters, nutrient analysis, water quality assessment, heavy metals, organic pollution indicators, sediment characterization, and other environmental quality parameters in accordance with approved methods. Please contact the laboratory to confirm the specific tests available.'
  -
    q: 'Does KMFRI perform food safety testing?'
    a: 'Yes. The laboratory supports food safety through testing of fish and fisheries products for quality and safety parameters within its approved scope.'
  -
    q: 'Is the laboratory ISO certified?'
    a: 'Yes. KMFRI operates a Quality Management System certified to ISO 9001:2015, demonstrating our commitment to quality service delivery and continual improvement.'
  -
    q: 'Is the laboratory accredited?'
    a: 'The laboratory is currently awaiting an accreditation decision from the Kenya Accreditation Service (KENAS) for compliance with ISO/IEC 17025:2017, the international standard for the competence of testing and calibration laboratories.'
  -
    q: 'What is the difference between ISO 9001 and ISO/IEC 17025?'
    a: 'ISO 9001:2015 focuses on quality management systems, ensuring consistent service delivery and customer satisfaction. ISO/IEC 17025:2017 demonstrates technical competence, confirming that laboratory results are technically valid, reliable, and internationally recognized.'
  -
    q: 'Who can use KMFRI laboratory services?'
    a: 'Our services are available to government agencies, county governments, environmental consultants, industries, research institutions, universities, NGOs, aquaculture farms, fisheries-sector stakeholders, private companies, development partners, and individual clients.'
  -
    q: 'How do I submit samples?'
    a: 'Clients should contact the laboratory before sample collection, obtain guidance on sampling requirements, complete the Laboratory Sample Submission Form, and deliver samples under appropriate preservation and transportation conditions.'
  -
    q: 'Can the laboratory assist with sampling?'
    a: 'Yes. Subject to availability and the nature of the project, KMFRI can provide professional sampling services or technical guidance on correct sampling procedures.'
  -
    q: 'How long does testing take?'
    a: 'Turnaround times depend on the type of analysis, number of samples, analytical complexity, and instrument availability. Estimated turnaround times are communicated upon sample receipt.'
  -
    q: 'Are laboratory results confidential?'
    a: 'Yes. All customer information, analytical data, and reports are treated as confidential and released only to authorized persons unless disclosure is required by law.'
  -
    q: 'How is the quality of laboratory results assured?'
    a: 'Quality is maintained through standardized analytical methods, qualified and competent personnel, equipment calibration and maintenance, internal quality control, participation in proficiency testing, internal audits, management reviews, and continuous improvement under the ISO 9001 Quality Management System.'
  -
    q: 'Are laboratory reports acceptable for regulatory purposes?'
    a: "Yes. Reports issued for tests within the laboratory's approved scope can support regulatory submissions, environmental monitoring, research, compliance, and decision-making, subject to the requirements of the receiving authority."
  -
    q: 'Can KMFRI undertake customized analytical projects?'
    a: 'Yes. The laboratory works with clients to develop analytical solutions for research, environmental monitoring, fisheries, aquaculture, coastal management, and Blue Economy projects.'
  -
    q: 'How much do laboratory services cost?'
    a: 'Testing charges depend on the type of analysis, number of parameters, sample matrix, and number of samples. Please request a quotation from the laboratory before submitting samples.'
  -
    q: 'Where is the laboratory located?'
    a: 'Kenya Marine and Fisheries Research Institute (KMFRI), Mombasa Headquarters, Mombasa, Kenya. Satellite laboratories are also available in selected KMFRI research centres across the country for specific services.'
  -
    q: 'How can I contact the laboratory?'
    a: 'Deputy Director, Laboratory Services, Kenya Marine and Fisheries Research Institute (KMFRI). Email: wogara@kmfri.go.ke.'
