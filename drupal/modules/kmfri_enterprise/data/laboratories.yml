overview:
  title: 'KMFRI Laboratory Services'
  intro: "KMFRI Laboratories are a national centre of excellence providing scientific testing, research, and analytical services that support Kenya's Blue Economy. Through a network of specialized laboratories across the country, KMFRI generates reliable data and evidence that underpin sustainable fisheries, aquaculture development, environmental stewardship, food safety, biodiversity conservation, and climate resilience."
  quality: 'The KMFRI Main Laboratory in Mombasa is NEMA-designated, ISO 9001:2015-certified, and finalizing its ISO/IEC 17025:2017 accreditation — reflecting our commitment to technical competence, quality assurance, and internationally recognized laboratory standards.'
